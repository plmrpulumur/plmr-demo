name: Publish PLMR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Require a new publication run
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "::error::Start a new workflow_dispatch run or push a new commit. Do not re-run an old failed publication."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/configure-pages@v6.0.0
      - name: Build PLMR static application
        run: npm run build
      - name: Verify publication files
        run: npm run verify
      - name: Name this run's single Pages artifact
        id: artifact
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: echo "name=github-pages-${RUN_ID}-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: _site
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require a new deployment run
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "::error::Start a new workflow_dispatch run or push a new commit. Do not re-run an old failed publication."
            exit 1
          fi
      - name: Deploy this run's artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
